id: RULE-012
name: "Aumento anormal de respostas HTTP 403"
description: >
  Detecta um pico de respostas HTTP 403 (não autorizado) em endpoints
  monitorados, para o mesmo ator, dentro de uma janela curta.
enabled: true
eventTypes:
  - api.response.error
evaluatorType: threshold-count
conditions:
  metadataKey: httpStatus
  metadataEquals: "403"
aggregationWindow: "PT5M"
threshold: 4
severity: MEDIUM
baseRiskScore: 30
mitreTactic: "Initial Access"
mitreTechnique: "T1190 - Exploit Public-Facing Application"
recommendedPlaybook: "playbook-abuso-de-privilegio"
version: "1.0.0"
falsePositiveNotes: >
  Testes de integração mal configurados podem gerar picos de 403 legítimos;
  validar se o padrão de endpoints tentados é consistente com varredura.
references:
  - "https://attack.mitre.org/techniques/T1190/"
author: "CoopShield SOC"
createdAt: "2026-08-24"
updatedAt: "2026-08-24"
